name: Build aarch64 AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_OPTIONS: '--max_old_space_size=4096'
  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
  APP_SIGNAL_REVISION: ${{ github.ref_name }}
  CX_API_URL: ${{ vars.CX_API_URL }}
  CX_REPO_RELEASE: ${{ vars.CX_REPO_RELEASE }}
  CX_WEB_URL: ${{ vars.CX_WEB_URL }}
  APP_SIGNAL_KEY: ${{ secrets.APP_SIGNAL_KEY }}
  GITHUB_SHA: ${{ github.sha }}

jobs:
  build-appimage:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v3

      - name: Rust setup
        uses: hecrj/setup-rust-action@v2

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'
          cache: 'yarn'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # install tauri v1 gtk/webkit2gtk/libsoup2.4 dependencies on ubuntu 22.04
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev libsoup2.4-dev patchelf file

      - name: Install frontend dependencies and build web
        run: yarn && yarn build

      - name: Build aarch64 AppImage
        # build only the appimage bundle without creating a github release
        run: yarn tauri build --bundles appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage